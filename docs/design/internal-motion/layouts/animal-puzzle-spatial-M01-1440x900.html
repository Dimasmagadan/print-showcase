<p>Пазл для ребёнка двух с половиной лет: всего четыре детали, каждая
толщиной 10 мм — удобно брать маленькими руками, а собранный заяц сразу узнаётся.
Никакой рамки и ручек, только силуэт.</p>
<h2 id=&quot;как-делал&quot;>Как делал</h2>
<p>Начал с выбора силуэта зайца в прыжке и разрезал его так, чтобы каждая часть
была узнаваемой: задние лапы с хвостом, туловище, голова с ушами, грудка с
передними лапами. Части соединяются классическими замками-«ушками».</p>
<p>Самое тонкое место пазла — зазор в замке. Сначала напечатал маленький
пробник из двух половинок с зазором 0,45 мм: детали болтались. Уменьшил до
0,30 мм на сторону — так замок держит, но ребёнок всё ещё может разобрать
пазл без усилия. Замок у головы сделал поменьше, чтобы не спорил с ушами.</p>
<p>Потом добавил подложку: низкий бортик точно по контуру зайца, внутри которого
собирать проще. Сначала была прямоугольная платформа, но она съедала лишний
пластик — контурная оказалась и красивее, и экономнее. Детали выступают над
бортиком, поэтому выемка для пальца не нужна.</p>
<h2 id=&quot;печать&quot;>Печать</h2>
<p>Все детали печатаются плашмя, без поддержек: слой 0,2 мм, три стенки,
заполнение 15%. Цвет каждой части — любой: можно печатать по очереди
разными пластиками или одним заходом с AMS. Кромки подложки скруглены и
подрезаны под 45° у стола, чтобы обойтись без поддержек.</p>
